name: Fund Monitor

on:
  # 定时执行：工作日交易时间高频执行
  schedule:
    # 北京时间交易时间：9:30-11:30, 13:00-15:00
    # 使用UTC时间（北京时间 = UTC + 8）
    # 增加更多执行点，确保覆盖所有时间

    # 上午时段
    - cron: '30 1 * * 1-5'   # 北京时间9:30
    - cron: '0 2 * * 1-5'     # 北京时间10:00
    - cron: '30 2 * * 1-5'   # 北京时间10:30
    - cron: '0 3 * * 1-5'     # 北京时间11:00
    - cron: '30 3 * * 1-5'   # 北京时间11:30

    # 下午时段
    - cron: '0 5 * * 1-5'     # 北京时间13:00
    - cron: '30 5 * * 1-5'   # 北京时间13:30
    - cron: '0 6 * * 1-5'     # 北京时间14:00
    - cron: '30 6 * * 1-5'   # 北京时间14:30
    - cron: '0 7 * * 1-5'     # 北京时间15:00

  # 支持手动触发
  workflow_dispatch:

  # 推送代码时执行（用于测试）
  push:
    branches: [ main, master ]

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Run Monitor
      env:
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
      run: |
        python monitor.py

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: monitor-logs-${{ github.run_number }}
        path: |
          monitor/*.log
        retention-days: 7
