name: Fund Monitor

on:
  # 定时执行：工作日每30分钟执行一次
  schedule:
    # 市场交易时间: 9:30-11:30, 13:00-15:00
    # 使用cron表达式，时区为UTC
    # 北京时间9:30 = UTC 1:30
    # 北京时间15:00 = UTC 7:00
    - cron: '30 1,2 * * 1-5'   # 9:30, 10:30 (周一至周五)
    - cron: '0 3,4,5,6 * * 1-5' # 11:00, 12:00, 13:00, 14:00 (周一至周五)
    - cron: '30 3,4,5,6 * * 1-5' # 11:30, 12:30, 13:30, 14:30 (周一至周五)

  # 支持手动触发
  workflow_dispatch:

  # 推送代码时执行（用于测试）
  push:
    branches: [ main, master ]
    paths:
      - 'monitor/**'
      - '.github/workflows/monitor.yml'

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Run Monitor
      env:
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
      run: |
        cd monitor
        python monitor.py

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: monitor-logs-${{ github.run_number }}
        path: |
          monitor/*.log
        retention-days: 7
